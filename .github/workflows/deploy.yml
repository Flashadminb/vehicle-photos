name: Deploy to Cloudflare
# Deploys to the Cloudflare account identified by the repository secrets
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (independent of any local `wrangler login`).
# Creates the D1 database / R2 bucket on first run, applies migrations, deploys, and sets
# Worker secrets. TOKEN_ENC_KEY is generated automatically once and never printed.
on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check required secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Prepare D1 and R2 in the target account
        id: prep
        run: node scripts/ci-prepare.mjs
      - name: Build
        run: npx vite build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Set Worker secrets
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          AIFORTHAI_API_KEY: ${{ secrets.AIFORTHAI_API_KEY }}
        run: |
          existing=$(npx wrangler secret list 2>/dev/null || echo "[]")
          if ! echo "$existing" | grep -q '"TOKEN_ENC_KEY"'; then
            echo "Generating TOKEN_ENC_KEY (once)…"
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put TOKEN_ENC_KEY > /dev/null
          fi
          for name in SETUP_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_VISION_API_KEY AIFORTHAI_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" > /dev/null
              echo "Set $name"
            fi
          done
      - name: Summary
        run: |
          url="${{ steps.deploy.outputs.url }}"
          {
            echo "## ✅ Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Field app (phones) | $url/ |"
            echo "| Admin dashboard | $url/admin/ |"
            echo "| Google OAuth redirect URI | \`$url/api/admin/drive/oauth/callback\` |"
            echo ""
            echo "Next: open the dashboard → create the first Super Admin with your SETUP_TOKEN → Google Drive page → Connect Google Drive."
          } >> "$GITHUB_STEP_SUMMARY"
