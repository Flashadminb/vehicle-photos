name: Deploy to Cloudflare
# Manual deploy to the Cloudflare account whose API token / account ID are stored as
# repository secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). This is independent
# of whichever Cloudflare account is logged in on anyone's computer.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fill in D1 database ID
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" wrangler.jsonc
      - name: Build, migrate, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx vite build
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
